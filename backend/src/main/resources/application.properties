#Banco de dados
spring.application.name=doc_integrity_blockchain
spring.datasource.url=jdbc:mysql://localhost:3306/blockchain_database?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-binding-errors=always

#Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Conexão com a blockchain
blockchain.rcp-url=https://rpc-amoy.polygon.technology/
blockchain.contract-address=0x17fAd7925399828dfa46240E14900e7ED8Cbe7E1
blockchain.private-key=${PRIVATE_KEY}